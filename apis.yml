  detail: >-
    Elpha Secure's Terms of Service section 9 defines "Elpha Secure API's" as SOAP-
    or REST-based interfaces and says Sample Code and API documentation sit on "the
    Site" for third parties building integrations, but no such page is publicly
    linked or reachable — the only entry point is the my.elphasecure.com portal
    sign-in behind a broker appointment, and api/docs/developer.elphasecure.com do
    not resolve at all.
