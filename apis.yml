aid: elpha-secure
name: Elpha Secure
description: 'Elpha Secure is a New York-based cyber insurance managing general agent
  (MGA) for small and midsize businesses that bundles a first-party cybersecurity software
  agent with the insurance policy itself. The Elpha Agent ships endpoint detection
  and response, Malware Guard anti-malware, encrypted offsite backup, multi-factor
  authentication for remote desktop access, email security (ES Mail), financial fraud
  detection, vulnerability and security-posture scoring, and XDR integrations with
  SentinelOne, Sophos, Trend Micro and CrowdStrike, all managed from the Elpha Secure
  Portal. Policies are distributed through appointed brokers who quote and bind in
  the broker portal. Elpha Secure publishes no public developer portal, API reference
  or machine-readable specification; its Terms of Service define "Elpha Secure API''s"
  as SOAP- or REST-based interfaces made available to customers and integrators under
  agreement.'
